deptrac:
  paths:
    - ../../src/Core
    - ../../src/Http
    - ../../tests
  exclude_files:
    - '.*/vendor/.*'
    - '.*/var/.*'
    - fixtures
  layers:
    - name: Application
      collectors:
        - type: classLike
          value: ^Shared\\Core\\(?!Test)
    - name: Http
      collectors:
        - type: classLike
          value: ^Shared\\Http\\(?!Test)
    - name: Test
      collectors:
        - type: classLike
          value: ^Shared\\Core\\Test
  ruleset:
    Application: []
    Http: []
    Test: [Application, Http]