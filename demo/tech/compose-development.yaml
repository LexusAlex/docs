services:
  api-nginx:
    build:
      context: api/docker
      dockerfile: development/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./api:/api
    depends_on:
      - api-php-fpm
  api-php-fpm:
    build:
      context: api/docker
      dockerfile: development/php-fpm/Dockerfile
    environment:
      APPLICATION_ENVIRONMENT: development
      APPLICATION_DEBUG: 1
    volumes:
      - ./api:/api