services:
  php-cli:
    build:
      context: docker
      dockerfile: php-cli/Dockerfile
    volumes:
      - ./:/docs/demo/yii3
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
  php-fpm:
    build:
      context: docker
      dockerfile: php-fpm/Dockerfile
    volumes:
      - ./:/docs/demo/yii3
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
  nginx:
    build:
      context: docker
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./:/docs/demo/yii3
    depends_on:
      - php-fpm